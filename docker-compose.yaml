# nginx proxy address - http://172.17.0.1:64204

name: i2p
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: geti2p/i2p:latest
    container_name: i2p-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: i2p-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    ports:
      - '172.17.0.1:64204:7657'
      - '4444:4444'
      - '4445:4445'
      - '6668:6668'
      - '7654:7654'
      - '7656:7656'
      - '12345:12345'
    volumes:
      - './volumes/config/i2p:/i2p/.i2p:z'
      - './volumes/data/i2p:/i2psnark:z'
    networks:
      - i2p

networks:
  i2p:
    name: i2p
    external: false
